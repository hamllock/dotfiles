[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold italic fg:#d2bcfd)"
error_symbol = "[○](italic fg:#f0b7c5)"
vimcmd_symbol = "[■](italic fg:#95d5a7)"
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = "italic fg:#95d5a7"

[sudo]
format = "[$symbol]($style)"
style = "bold italic fg:#f0b7c5"
symbol = "⋈┈"
disabled = false

[username]
style_user = "bold italic fg:#d2bcfd"
style_root = "bold italic fg:#f0b7c5"
format = "[⭘ $user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = "□ "
read_only = " ◈"
use_os_path_sep = true
style = "italic fg:#d2bcfd"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = "bold fg:#d2bcfd"
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold fg:#eaddff)'

[cmd_duration]
min_time = 0
format = "[◄ $duration ](italic fg:#cbc4cf)"

[jobs]
format = "[$symbol$number]($style) "
style = "fg:#cbc4cf"
symbol = "[▶](italic fg:#d2bcfd)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold fg:#f0b7c5)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic fg:#948f99"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold fg:#95d5a7)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold fg:#ffb4ab"

[[battery.display]]
threshold = 60
style = "italic fg:#f0b7c5"

[[battery.display]]
threshold = 70
style = "italic fg:#d2bcfd"

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[△](bold italic fg:#eaddff)"
style = "italic fg:#eaddff"
truncation_symbol = "⋯"
truncation_length = 11
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = "italic fg:#95d5a7"
deleted_style = "italic fg:#ffb4ab"
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic fg:#eaddff"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic fg:#f0b7c5)"
ahead = "[▴│[${count}](bold fg:#e7e0e8)│](italic fg:#95d5a7)"
behind = "[▿│[${count}](bold fg:#e7e0e8)│](italic fg:#ffb4ab)"
diverged = "[◇ ▴┤[${ahead_count}](fg:#e7e0e8)│▿┤[${behind_count}](fg:#e7e0e8)│](italic fg:#f0b7c5)"
untracked = "[◌◦](italic fg:#d2bcfd)"
stashed = "[◃◈](italic fg:#cbc4cf)"
modified = "[●◦](italic fg:#f0b7c5)"
staged = "[▪┤[$count](bold fg:#e7e0e8)│](italic fg:#cdc2db)"
renamed = "[◎◦](italic fg:#d2bcfd)"
deleted = "[✕](italic fg:#ffb4ab)"

[deno]
format = " [deno](italic) [∫ $version](bold fg:#95d5a7)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
