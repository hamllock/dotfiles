# Fastfetch configuration
# This config adds many useful modules and displays a custom logo.
# Place your logo image at the path specified below (PNG, SVG, etc.)
# and ensure your terminal supports image rendering (e.g., Kitty, iTerm2, WezTerm).

# Logo settings
logo_path = "${HOME}/.config/fastfetch/logo.png"
logo_width = 30
logo_height = 30
logo_offset_x = 0
logo_offset_y = 0

# Color scheme (uses 256-color palette for better compatibility)
color_title = "#ffaf00"
color_text = "#c0c0c0"
color_key = "#00afff"
color_value = "#ff5f5f"

# Modules to display (add or remove as you like)
# The order defines how they appear in the output.
# Each line enables a module with optional custom formatting.
# See https://github.com/fastfetch-cli/fastfetch for full module list.

# System information
os = true
kernel = true
desktop_environment = true
window_manager = true
theme = true
icons = true
font = true
shell = true
terminal = true
cpu = true
gpu = true
memory = true
swap = true
uptime = true
packages = true
local_ip = true
public_ip = true
battery = true

# Additional details
# custom_text = "My custom tagline"

separator = " • "

logo = true

# End of configuration
